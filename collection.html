
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fashion Collection</title>
  <style>
 
    
.collection-page {
  padding: 80px 10%;
  text-align: center;
}

.collection-page h2 {
  font-size: 45px;
  margin-bottom: 40px;
}

.collection-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 25px;
}

.fashion-item {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  transition: 0.3s;
}

.fashion-item:hover {
  transform: scale(1.03);
}

.fashion-item img {
  width: 100%;
  height: 350px;
  object-fit: cover;
}

.fashion-item h3 {
  margin: 15px 0 10px;
}

.fashion-item p {
  color: #ff4081;
  font-size: 20px;
  margin-bottom: 15px;
}

.fashion-item button {
  margin-bottom: 20px;
  padding: 10px 25px;
  border: none;
  background: black;
  color: white;
  border-radius: 5px;
  cursor: pointer;
  transition: 0.3s;
}

.fashion-item button:hover {
  background: #ff4081;
}



nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 10%;
  background: black;
  position: sticky;
  top: 0;
}

.logo {
  color: white;
  font-size: 28px;
}

nav ul {
  display: flex;
  list-style: none;
}

nav ul li {
  margin-left: 20px;
}

nav ul li a {
  text-decoration: none;
  color: white;
  font-size: 18px;
  transition: 0.3s;
}

nav ul li a:hover {
  color: #ff4081;
}

  </style>
  <!-- <link rel="stylesheet" href="style.css"> -->
</head>

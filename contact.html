
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <style>
    

nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 10%;
  background: black;
  position: sticky;
  top: 0;
}

.logo {
  color: white;
  font-size: 28px;
}

nav ul {
  display: flex;
  list-style: none;
}

nav ul li {
  margin-left: 20px;
}

nav ul li a {
  text-decoration: none;
  color: white;
  font-size: 18px;
  transition: 0.3s;
}

nav ul li a:hover {
  color: #ff4081;
}

    
.contact-page {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 50px;
  padding: 80px 10%;
  flex-wrap: wrap;
}

.contact-info {
  max-width: 450px;
}

.contact-info h2 {
  font-size: 45px;
  margin-bottom: 20px;
}

.contact-info p {
  font-size: 18px;
  line-height: 1.8;
  margin-bottom: 20px;
}

.info-box {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.info-box h3 {
  margin-bottom: 10px;
  color: #ff4081;
}

.contact-form-box {
  background: white;
  padding: 40px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  width: 500px;
}

.contact-form-box form {
  display: flex;
  flex-direction: column;
}

.contact-form-box input,
.contact-form-box textarea {
  padding: 15px;
  margin-bottom: 20px;
  border: 1px solid #ccc;
  border-radius: 5px;
  font-size: 16px;
}

.contact-form-box button {
  padding: 15px;
  border: none;
  background: black;
  color: white;
  font-size: 18px;
  border-radius: 5px;
  cursor: pointer;
  transition: 0.3s;
}

.contact-form-box button:hover {
  background: #ff4081;
}


  </style>
  
</head>
<body>

  <nav>
    <h1 class="logo">FASHION HUB</h1>

    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="collection.html">Collection</a></li>
      <li><a href="about.html" >About</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>


  <section class="contact-page">

    <div class="contact-info">
      <h2>Get In Touch</h2>

      <p>
        We would love to hear from you. Contact us for fashion collections,
        orders, and style suggestions.
      </p>

      <div class="info-box">
        <h3>Email</h3>
        <p>fashionhub@gmail.com</p>
      </div>

      

      <div class="info-box">
        <h3>Location</h3>
        <p>sukkur, Pakistan</p>
      </div>
    </div>


    <div class="contact-form-box">
      <form>
        <input type="text" placeholder="Your Name" required>

        <input type="email" placeholder="Your Email" required>

        <input type="text" placeholder="Subject">

        <textarea rows="6" placeholder="Your Message"></textarea>

        <button type="submit">Send Message</button>
      </form>
    </div>

  </section>


  <footer>
    <p>© 2026 Fashion Hub | All Rights Reserved</p>
  </footer>

</body>
</html>
